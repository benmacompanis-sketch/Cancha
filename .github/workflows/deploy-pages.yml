name: Deploy a GitHub Pages

on:
  push:
    branches: [main, claude/football-booking-platform-oq4gd7]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las API routes (disponibilidad, webhook de Mercado Pago) son
      # server-side y no existen en un sitio estático: se excluyen solo
      # de esta build. En Vercel/Node se despliegan normalmente.
      - name: Excluir API routes de la build estática
        run: rm -rf src/app/api

      - name: Build estática
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # Publica en la rama gh-pages (fuente de GitHub Pages). Este método
      # no requiere habilitar Pages manualmente: GitHub lo activa solo
      # al existir la rama. `.nojekyll` evita que Jekyll ignore /_next.
      - name: Publicar en gh-pages
        run: |
          cd out
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
